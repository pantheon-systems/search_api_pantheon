services:
  logger.channel.search_api_pantheon:
    parent: logger.channel_base
    arguments: ['search_api_pantheon']
  search_api_pantheon.schema_poster:
    class: Drupal\search_api_pantheon\Services\SchemaPoster
    arguments: ['@logger.factory', '@entity_type.manager', '@http_client', '@extension.list.module']
  search_api_pantheon.event_subscriber:
    class: Drupal\search_api_pantheon\EventSubscriber\SearchApiPantheonSolrConfigFilesAlter
    tags:
      - { name: event_subscriber }
  search_api_pantheon.solr_commit_aware_cache_invalidator:
    class: Drupal\search_api_pantheon\EventSubscriber\SolrCommitAwareCacheInvalidator
    arguments: ['@state', '@config.factory']
    tags:
      - { name: cache_tags_invalidator }
      - { name: event_subscriber }
